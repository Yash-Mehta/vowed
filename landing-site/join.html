<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a wedding on Vowed</title>
<meta name="description" content="Open your Vowed invite.">
<!-- Shared invite links land here. If the app is installed we hand straight
     over to it; otherwise this page is the store signpost and shows the code so
     it is never lost. A vowed:// link alone would be dead text to anyone who
     does not have the app yet — which is most of a guest list. -->
<style>
  :root {
    --cream: #FAF6F1;
    --surface: #F4ECE2;
    --ink: #2A1D17;
    --ink-soft: #5C463C;
    --accent: #7A4A3F;
    --accent-deep: #5C3329;
    --gold: #B08D3E;
    --line: rgba(122, 74, 63, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream) 45%, var(--surface) 100%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }
  main { width: 100%; max-width: 26rem; text-align: center; }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(2.6rem, 12vw, 3.4rem);
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--accent-deep);
    margin: 0;
  }
  .rule { width: 4.5rem; height: 1px; background: var(--gold); opacity: 0.6; margin: 1.25rem auto; }
  .lede { font-size: 1.05rem; line-height: 1.5; color: var(--ink-soft); margin: 0 0 2rem; }
  .code-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1rem 1.25rem;
    margin-bottom: 2rem;
  }
  .code-label {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 0.4rem;
  }
  .code { font-size: 1.6rem; font-weight: 600; letter-spacing: 0.08em; color: var(--accent-deep); }
  .open {
    display: block;
    background: var(--accent-deep);
    color: var(--cream);
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    padding: 1rem;
    border-radius: 999px;
    margin-bottom: 1.5rem;
  }
  .stores { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
  .stores a {
    flex: 1 1 8rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.8rem 1rem;
    text-decoration: none;
    color: var(--accent-deep);
    font-weight: 600;
    font-size: 0.9rem;
    background: #fff;
  }
  .hint { font-size: 0.8rem; color: var(--ink-soft); margin-top: 1.75rem; line-height: 1.5; }
  @media (prefers-color-scheme: dark) {
    /* The brand is a light one; keep it light rather than inventing a dark
       palette that nothing else in the product uses. */
    body { background: var(--cream); }
  }
</style>
</head>
<body>
<main>
  <h1>Vowed</h1>
  <div class="rule"></div>
  <p class="lede" id="lede">You’ve been invited to a wedding.</p>

  <div class="code-card" id="code-card" hidden>
    <div class="code-label">Your invite code</div>
    <div class="code" id="code"></div>
  </div>

  <a class="open" id="open" href="#">Open in Vowed</a>

  <div class="stores">
    <a href="https://apps.apple.com/us/app/vowed-social/id6766561614">Download for iPhone</a>
    <a href="https://play.google.com/store/apps/details?id=com.vowed.app">Download for Android</a>
  </div>

  <p class="hint" id="hint">
    Already have the app? Tap “Open in Vowed”. Otherwise install it, then enter the code above.
  </p>
</main>

<script>
  (function () {
    var code = new URLSearchParams(window.location.search).get('code');
    var deepLink = code ? 'vowed://invite?code=' + encodeURIComponent(code) : 'vowed://invite';
    var open = document.getElementById('open');
    open.setAttribute('href', deepLink);

    if (code) {
      document.getElementById('code').textContent = code;
      document.getElementById('code-card').hidden = false;
    } else {
      document.getElementById('lede').textContent = 'Open Vowed to join a wedding.';
      document.getElementById('hint').textContent =
        'This link is missing its invite code — ask whoever sent it to share again from the app.';
    }

    // Try handing over to the app immediately, but only on a phone: on desktop
    // it would just fail noisily, and the page is a useful signpost there.
    // No redirect to the store on a timer — that misfires when someone has the
    // app but is slow to grant the "open in app" prompt, and it hijacks the
    // back button.
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      window.location.href = deepLink;
    }
  })();
</script>
</body>
</html>
